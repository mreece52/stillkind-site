<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --ink:      #17140F;
    --paper:    #F6F1E7;
    --paper2:   #EFE7D6;
    --copper:   #B5502E;
    --copper2:  #8F3D22;
    --clay:     #D8C9AA;
    --grey:     #55504A;
    --lgrey:    #8A8378;
    --white:    #FFFFFF;
  }

  html { scroll-behavior:smooth; }

  body {
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:17px;
    line-height:1.6;
    overflow-x:hidden;
  }

  h1,h2,h3,h4 { font-family:'Lora',serif; font-weight:500; }

  a { color:inherit; text-decoration:none; }

  img { display:block; max-width:100%; }

  ::selection { background:var(--copper); color:var(--paper); }

  /* ============ NAV ============ */
  nav {
    position:fixed; top:0; left:0; right:0; z-index:250;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 56px;
    background:rgba(246,241,231,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(23,20,15,0.08);
    transition:padding 0.3s ease;
  }
  .nav-logo img { height:26px; width:auto; }
  .nav-links { display:flex; align-items:center; gap:40px; list-style:none; }
  .nav-links a {
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--grey); font-weight:600;
    position:relative; padding-bottom:4px;
    transition:color 0.2s;
  }
  .nav-links a::after {
    content:''; position:absolute; bottom:0; left:0; right:100%; height:1.5px;
    background:var(--copper); transition:right 0.25s ease;
  }
  .nav-links a:hover { color:var(--ink); }
  .nav-links a:hover::after { right:0; }
  .nav-cta {
    background:var(--ink); color:var(--paper) !important;
    padding:11px 22px; border-radius:2px;
    font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  }
  .nav-cta::after { display:none; }
  .nav-cta:hover { background:var(--copper); }
  .nav-ig {
    display:flex; align-items:center; color:var(--grey);
    transition:color 0.2s; padding-bottom:0 !important;
  }
  .nav-ig::after { display:none; }
  .nav-ig:hover { color:var(--copper); }

  /* ============ HAMBURGER MENU ============ */
  .nav-burger {
    display:none;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    width:32px; height:32px;
    background:none; border:none; cursor:pointer;
    padding:0; z-index:220;
    position:relative;
  }
  .nav-burger span {
    display:block; width:100%; height:2px;
    background:var(--ink); border-radius:2px;
    transition:transform 0.25s ease, opacity 0.2s ease;
  }
  .nav-burger.is-open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  .nav-burger.is-open span:nth-child(2) { opacity:0; }
  .nav-burger.is-open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

  .mobile-menu {
    position:fixed; top:0; right:0; bottom:0;
    width:min(78vw, 340px);
    background:var(--paper);
    border-left:1px solid rgba(23,20,15,0.12);
    z-index:200;
    padding:100px 36px 40px;
    display:flex; flex-direction:column; gap:4px;
    transform:translateX(100%);
    transition:transform 0.32s cubic-bezier(.4,0,.2,1);
    box-shadow:-8px 0 30px rgba(0,0,0,0.08);
  }
  .mobile-menu.is-open { transform:translateX(0); }
  .mobile-menu a {
    font-family:'Lora',serif; font-size:24px; font-weight:500;
    color:var(--ink); padding:16px 0;
    border-bottom:1px solid rgba(23,20,15,0.1);
  }
  .mobile-menu a.mobile-cta {
    margin-top:20px; border-bottom:none;
    background:var(--ink); color:var(--paper);
    text-align:center; border-radius:2px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    letter-spacing:0.07em; text-transform:uppercase; padding:15px 0;
  }

  /* Mobile floating contact button — always reachable, no scrolling required */
  .mobile-fab {
    display:none; position:fixed; bottom:20px; right:20px; z-index:150;
    align-items:center; gap:8px;
    background:var(--ink); color:var(--paper);
    padding:14px 20px; border-radius:30px;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase;
    box-shadow:0 8px 24px rgba(23,20,15,0.3);
  }
  .mobile-fab svg { flex-shrink:0; }

  .mobile-menu-overlay {
    position:fixed; inset:0; background:rgba(23,20,15,0.35);
    z-index:190; opacity:0; pointer-events:none;
    transition:opacity 0.28s ease;
  }
  .mobile-menu-overlay.is-open { opacity:1; pointer-events:auto; }

  /* ============ HERO ============ */
  #hero {
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    padding:120px 56px 100px;
    position:relative;
    background:
      radial-gradient(ellipse 900px 500px at 85% 15%, rgba(181,80,46,0.10), transparent),
      var(--paper);
    border-bottom:1px solid rgba(23,20,15,0.08);
  }
  .identity-strip {
    max-width:1320px; margin:0 auto 40px; width:100%;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:12.5px; letter-spacing:0.05em; color:var(--grey);
    padding-bottom:20px; border-bottom:1px solid rgba(23,20,15,0.1);
  }
  .identity-strip-brand {
    font-family:'Lora',serif; font-weight:600; letter-spacing:0.1em; color:var(--ink);
    font-size:13px;
  }
  .identity-strip-dot { color:var(--copper); opacity:0.6; }
  .identity-strip-link {
    color:var(--grey); transition:color 0.2s;
    border-bottom:1px solid transparent;
  }
  .identity-strip-link:hover {
    color:var(--copper); border-bottom-color:var(--copper);
  }
  .hero-grid {
    display:block;
    max-width:1320px; margin:0 auto; width:100%;
  }
  .hero-eyebrow {
    display:flex; align-items:center; gap:12px;
    font-size:13px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--copper); font-weight:700; margin-bottom:28px;
  }
  .hero-eyebrow::before {
    content:''; width:34px; height:1.5px; background:var(--copper);
  }
  .hero-headline {
    font-size:clamp(48px, 6.4vw, 92px);
    line-height:0.98; font-weight:500; letter-spacing:-0.01em;
    color:var(--ink);
  }
  .hero-headline em {
    font-style:italic; font-weight:400; color:var(--copper);
  }
  .hero-side {
    padding-bottom:10px;
  }
  .hero-body {
    font-size:18px; color:var(--grey); line-height:1.7; margin-bottom:32px;
    max-width:420px;
  }
  .hero-buttons { display:flex; gap:14px; flex-wrap:wrap; }
  .btn-primary {
    background:var(--ink); color:var(--paper);
    padding:15px 28px; border-radius:2px;
    font-size:13px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
    display:inline-block; transition:background 0.2s;
  }
  .btn-primary:hover { background:var(--copper); }
  .btn-outline {
    border:1.5px solid var(--ink); color:var(--ink);
    padding:14px 26px; border-radius:2px;
    font-size:13px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
    display:inline-block; transition:all 0.2s;
  }
  .btn-outline:hover { background:var(--ink); color:var(--paper); }

  /* ============ CHOICE CARDS ============ */
  .choice-grid {
    max-width:1320px; margin:64px auto 0; width:100%;
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;
  }
  .choice-card {
    display:block; padding:40px 38px; border-radius:4px;
    background:var(--ink); color:var(--paper);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
    position:relative; overflow:hidden;
  }
  .choice-card::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 85% 15%, rgba(181,80,46,0.16), transparent 60%);
    pointer-events:none;
  }
  .choice-card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(23,20,15,0.18); }
  .choice-card-alt { background:var(--copper); }
  .choice-card-tap-hint { display:none; }
  .choice-card-alt::after { background:radial-gradient(circle at 85% 15%, rgba(23,20,15,0.16), transparent 60%); }
  .choice-card-label {
    font-size:12px; letter-spacing:0.16em; text-transform:uppercase; font-weight:700;
    color:var(--clay); margin-bottom:14px; position:relative;
  }
  .choice-card-alt .choice-card-label { color:rgba(23,20,15,0.65); }
  .choice-card-title {
    font-family:'Lora',serif; font-size:26px; font-weight:500; line-height:1.2;
    margin-bottom:14px; position:relative;
  }
  .choice-card-desc {
    font-size:15px; line-height:1.6; color:rgba(246,241,231,0.68);
    margin-bottom:26px; max-width:380px; position:relative;
  }
  .choice-card-alt .choice-card-desc { color:rgba(23,20,15,0.72); }
