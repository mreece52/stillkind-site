name: Restore approved founder copy once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-kindness-copy-once.yml']
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.head_commit.message == 'Restore approved ranch opening in refreshed homepage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the founder section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          path = Path('index.html')
          data = path.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if actual != 'e26153993dafa0c27f7c5a428af9ec0fc430d751':
              raise RuntimeError('Homepage changed; refusing to overwrite newer edits')
          source = data.decode('utf-8')
          replacement = '''<section id="why" class="h-why">
            <div class="h-narrow">
              <h2 class="h-why-title">Nobody should go through it <em>alone.</em></h2>
              <p class="h-why-body">Your rent is still due. Your mom is still calling. You barely slept. And table twelve needs a fourth side of ranch.</p>
              <p class="h-why-body">That’s the work: holding the room while carrying your own life.</p>
              <p class="h-why-body">Still Kind is about showing up for the people around us. Front of house. Back of house. Across the table and outside the room. Sometimes that means helping a neighbor, backing a local cause, or simply making someone feel welcome.</p>
              <p class="h-why-body">Not because anyone needs pity. Because being good at taking care of people shouldn’t mean nobody notices when you need a little care, too.</p>
              <p class="h-sign">Madison Reece, Founder</p>
            </div>
          </section>'''
          pattern = r'<section\b[^>]*\bid="why"[^>]*>.*?</section>'
          updated, count = re.subn(pattern, lambda m: replacement, source, flags=re.S)
          if count != 1:
              raise RuntimeError('Expected exactly one founder section')
          path.write_text(updated, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore ranch opening and approved kindness-focused founder copy'
          git push origin HEAD:main
