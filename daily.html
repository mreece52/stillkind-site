<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Still Kind — Today's Thing</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17140F;
    --cream: #F6F1E7;
    --copper: #B5502E;
    --muted: #8A8378;
    --hairline: #2A251D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .card {
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .wordmark {
    font-family: 'Lora', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--cream);
    margin-bottom: 6px;
  }
  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
  }
  .rule {
    width: 36px;
    height: 1.5px;
    background: var(--copper);
    margin: 0 auto 36px;
  }
  .message {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: clamp(24px, 5.5vw, 38px);
    line-height: 1.4;
    color: var(--cream);
    margin: 0 0 48px;
    min-height: 1.4em;
  }
  .btn {
    display: inline-block;
    background: var(--copper);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.85; }
  .footer {
    margin-top: 36px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="card">
  <div class="wordmark">STILL KIND</div>
  <div class="label">Today's Thing</div>
  <div class="rule"></div>
  <div class="message" id="message">Loading something kind...</div>
  <a class="btn" href="https://www.instagram.com/stillkindchi/" target="_blank" rel="noopener">Follow @stillkindchi</a>
  <div class="footer">A new one every day. Scan again tomorrow.</div>
</div>

<script>
  var messages = [
    "You just walked in and the room's vibe went up two points. Science.",
    "That joke you just told? Add it to your highlight reel. It was that good.",
    "You are built different and the data (your group chat) supports this.",
    "Order the top-shelf thing. You're not a well-drink person tonight.",
    "Somebody at this bar is going to tell their roommate about you tomorrow like you're a celebrity sighting.",
    "You stopped being \"a lot\" the day everyone else got boring. Keep going.",
    "This week tried to end you and you showed up anyway looking like this. Legendary.",
    "You could start a cult based on vibes alone. Please don't. But you could.",
    "Nobody asked for your main-character arc to start tonight, but here we are.",
    "You're the reason this playlist suddenly feels better.",
    "Compliment yourself out loud right now. Nobody's listening. Do it anyway.",
    "You looked in a mirror today and saw somebody who has their life together. Keep that energy.",
    "Your laugh just made a stranger across the room smile. That's a public service.",
    "You are, undefeated, the funniest person at this table tonight.",
    "That drink order was iconic. The bartender is still thinking about it.",
    "You're one good story away from becoming this bar's folklore.",
    "Nobody peer-pressured you into being this interesting. You just are.",
    "You've got the energy of someone who just won something. Act like you did.",
    "Your \"weird\" is somebody else's favorite thing about you. Lean all the way in.",
    "This is your Roman Empire moment: being undeniably likable at a bar on a weeknight.",
    "You're not drunk off one drink, you're just finally relaxed enough to be your full self. Let her rip.",
    "Somebody just screenshotted something you said to send to their group chat.",
    "You are having main-character energy and the extras (everyone else) know it.",
    "The bartender remembers you. That's basically a celebrity endorsement.",
    "You're too fun for a Tuesday and that's exactly the problem Tuesday should have.",
    "Somebody tonight is going to go home and say \"I met the funniest person.\" That's you. Stay humble. Or don't.",
    "You've got main-character hair tonight. Flip it accordingly.",
    "This is your sign to be slightly too confident about something minor. Go for it.",
    "You are, undeniably, a vibe. An entire mood. A whole weather system.",
    "If tonight had a producer's cut, you'd get a slow-motion entrance.",
    "You're the plot twist this group chat didn't know it needed.",
    "Somebody's going to adopt your catchphrase from tonight by Monday.",
    "You are objectively more interesting than your phone. Put it down for five minutes and prove it.",
    "You walked in like you owned the place. Respect the delusion, it's working.",
    "Your confidence tonight could be bottled and sold as a supplement.",
    "You're the reason this night gets upgraded from \"fine\" to \"we have to tell people about this.\"",
    "Somebody's going to ask the bartender \"who was that\" about you. Let the legend grow.",
    "You are, undefeated, the best thing that's happened to this bar in the last hour.",
    "Whatever you're about to say next is going to be quoted later. No pressure.",
    "You're a whole personality and tonight the world finally caught up to it."
  ];

  function dayOfYear(d) {
    var start = new Date(d.getFullYear(), 0, 0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }

  var idx = dayOfYear(new Date()) % messages.length;
  document.getElementById('message').textContent = messages[idx];
</script>

</body>
</html>
