<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Today's Thing | Still Kind</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17140F;
    --cream: #F6F1E7;
    --copper: #B5502E;
    --muted: #8A8378;
    --hairline: #2A251D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .card {
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .wordmark {
    font-family: 'Lora', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--cream);
    margin-bottom: 6px;
  }
  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
  }
  .rule {
    width: 36px;
    height: 1.5px;
    background: var(--copper);
    margin: 0 auto 36px;
  }
  .message {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: clamp(24px, 5.5vw, 38px);
    line-height: 1.4;
    color: var(--cream);
    margin: 0 0 48px;
    min-height: 1.4em;
  }
  .btn {
    display: inline-block;
    background: var(--copper);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.85; }
  .footer {
    margin-top: 36px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .help { margin-top:28px; padding-top:22px; border-top:1px solid var(--hairline); font-size:14px; line-height:1.6; color:#B9B2A6; }
  .help a { color:#E39A78; font-weight:600; }
  .home { display:inline-block; margin-top:18px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .home:hover { color:var(--cream); }
  .footer { color:#9C9588; }
</style>
</head>
<body>

<div class="card">
  <div class="wordmark">STILL KIND</div>
  <div class="label">Today's Thing</div>
  <div class="rule"></div>
  <div class="message" id="message">Loading something kind...</div>
  <a class="btn" href="https://www.instagram.com/stillkindchi/" target="_blank" rel="noopener">Follow @stillkindchi</a>
  <div class="footer">A new one every day. Scan again tomorrow.</div>
  <div class="help">Today been a lot? Call or text <a href="tel:988">988</a>, the Suicide &amp; Crisis Lifeline. Free, confidential, 24/7.</div>
  <a class="home" href="index.html">stillkind.co</a>
</div>

<script>
  var messages = [
    "You showed up today. That counts more than you think.",
    "Text the friend who went quiet. Just \"thinking of you\" is plenty.",
    "Drink some water. Eat something real. You're a houseplant with opinions.",
    "You don't have to have it all figured out by tonight. Or this year.",
    "Somebody is having a better day because you exist. Annoying, but true.",
    "Hard days are allowed. So is asking for help on one.",
    "You've survived every bad day so far. Undefeated record.",
    "Compliment a stranger today. Worst case, you made it weird for three seconds.",
    "Rest is not a reward you have to earn.",
    "Your weird is somebody else's favorite thing about you. Lean in.",
    "You walked in and the room got a little better. That's just science.",
    "Small wins still count. Made the bed? Legend.",
    "Ask the bartender their name. Then actually use it.",
    "Nobody is thinking about that thing you said in 2019. Let it go.",
    "You're allowed to leave early. You're allowed to stay home. You're allowed to come back.",
    "Today's goal: be a little kinder to the person in the mirror.",
    "Call your grandma. Or someone's grandma. Grandmas love a call.",
    "Put the phone down for five minutes. You're more interesting than the feed.",
    "Still here? Good. We like you here.",
    "It's okay to not be okay today. Tomorrow gets a fresh start.",
    "Be the reason someone's group chat says \"okay but that was so nice.\"",
    "Check on your strong friend. They're tired too.",
    "You could start a cult based on vibes alone. Please don't. But you could.",
    "Hold the door. Let someone merge. Tip like you mean it.",
    "Today will be dope. And if it isn't, tomorrow's on deck.",
    "You're one good story away from becoming local folklore.",
    "Say thank you out loud, by name, to someone who earned it.",
    "Progress is still progress when it's slow.",
    "Take the walk. Chicago weather is a suggestion.",
    "If nobody told you today: you're doing better than you think."
  ];

  function dayOfYear(d) {
    var start = new Date(d.getFullYear(), 0, 0);
    var diff = d - start;
    return Math.floor(diff / 86400000);
  }

  var idx = dayOfYear(new Date()) % messages.length;
  document.getElementById('message').textContent = messages[idx];
</script>

</body>
</html>
